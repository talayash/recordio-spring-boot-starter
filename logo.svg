<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Outer ring - represents continuous recording -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#grad1)" stroke-width="8" opacity="0.3"/>

  <!-- Inner flowing arcs - represents I/O data flow -->
  <path d="M 100 30 A 70 70 0 0 1 170 100" fill="none" stroke="url(#grad2)" stroke-width="10" stroke-linecap="round"/>
  <path d="M 100 170 A 70 70 0 0 1 30 100" fill="none" stroke="url(#grad2)" stroke-width="10" stroke-linecap="round"/>

  <!-- Arrow heads for flow direction -->
  <polygon points="165,95 175,100 165,105" fill="#22d3ee"/>
  <polygon points="35,105 25,100 35,95" fill="#6366f1"/>

  <!-- Center record symbol -->
  <circle cx="100" cy="100" r="25" fill="url(#grad1)"/>
  <circle cx="100" cy="100" r="12" fill="#ffffff"/>
  <circle cx="100" cy="100" r="5" fill="url(#grad1)"/>
</svg>